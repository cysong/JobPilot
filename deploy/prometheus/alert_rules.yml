groups:
  # ===== SLO-anchored alerts =====
  - name: jobpilot_slo
    rules:
      # Prometheus scrapes (/metrics every 15s) and container healthchecks
      # (/health) far outnumber real requests on a single-user system; they
      # are excluded so real 5xx / slow responses are not diluted. With them
      # gone the denominator is tiny, so each rule also requires a minimum
      # event count to keep a single bad request from paging.
      - alert: APIHighErrorRate
        expr: |
          sum(rate(http_requests_total{handler!~"/metrics|/health", status=~"5.."}[5m]))
          / sum(rate(http_requests_total{handler!~"/metrics|/health"}[5m])) > 0.05
          and sum(increase(http_requests_total{handler!~"/metrics|/health", status=~"5.."}[5m])) >= 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx error rate exceeded 5%"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5m."
          runbook_url: "https://github.com/cysong/JobPilot/blob/master/docs/runbooks.md#apihigherrorrate"

      # Average latency, not P95 — single-user low-traffic systems don't have
      # enough samples in any short window to make `histogram_quantile` stable
      # (it returns bucket boundaries on sparse data). _sum / _count gives a
      # meaningful average even with 1-2 requests per window. NaN when idle so
      # the alert silently sleeps.
      - alert: APISlowRequests
        expr: |
          sum(rate(http_request_duration_seconds_sum{handler!~"/metrics|/health"}[10m]))
          / sum(rate(http_request_duration_seconds_count{handler!~"/metrics|/health"}[10m]))
          > 1
          and sum(increase(http_request_duration_seconds_count{handler!~"/metrics|/health"}[10m])) >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Average API request time exceeded 1s"
          description: "10m rolling average is {{ $value | humanizeDuration }}."
          runbook_url: "https://github.com/cysong/JobPilot/blob/master/docs/runbooks.md#apislowrequests"

      - alert: CeleryTaskFailureRate
        expr: |
          sum(rate(jobpilot_celery_task_total{event="failure"}[10m])) by (task_name)
          / sum(rate(jobpilot_celery_task_total{event=~"success|failure"}[10m])) by (task_name)
          > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Celery task {{ $labels.task_name }} failure rate > 10%"
          description: "Failure rate is {{ $value | humanizePercentage }} over the last 10m."
          runbook_url: "https://github.com/cysong/JobPilot/blob/master/docs/runbooks.md#celerytaskfailurerate"

      - alert: LLMCallFailureRate
        expr: |
          sum(rate(jobpilot_llm_call_total{outcome!="ok"}[10m])) by (agent_id)
          / sum(rate(jobpilot_llm_call_total[10m])) by (agent_id) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LLM agent {{ $labels.agent_id }} failure rate > 20%"
          description: "Non-ok outcomes are {{ $value | humanizePercentage }} of all calls."
          runbook_url: "https://github.com/cysong/JobPilot/blob/master/docs/runbooks.md#llmcallfailurerate"

  # ===== Anomaly patterns =====
  - name: jobpilot_anomaly
    rules:
      - alert: CeleryRetryStorm
        expr: sum(rate(jobpilot_celery_task_total{event="retry"}[5m])) by (task_name) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Celery retry storm for task {{ $labels.task_name }}"
          description: "Retry rate is {{ $value }}/s — likely a downstream dependency issue."
          runbook_url: "https://github.com/cysong/JobPilot/blob/master/docs/runbooks.md#celeryretrystorm"

      - alert: CeleryQueueBacklog
        expr: jobpilot_celery_queue_length > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Celery queue {{ $labels.queue_name }} backlog > 100"
          description: "Queue length is {{ $value }} — workers cannot keep up."
          runbook_url: "https://github.com/cysong/JobPilot/blob/master/docs/runbooks.md#celeryqueuebacklog"

      - alert: ResendDeliveryFailure
        expr: |
          sum(rate(jobpilot_resend_email_total{outcome!~"ok|validation_error"}[10m]))
          / sum(rate(jobpilot_resend_email_total[10m])) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Resend email delivery failure rate > 10%"
          description: "Non-deliverable rate is {{ $value | humanizePercentage }} — user signup / reset flows are degraded."
          runbook_url: "https://github.com/cysong/JobPilot/blob/master/docs/runbooks.md#resenddeliveryfailure"

  # ===== LLM quota =====
  - name: jobpilot_llm_quota
    rules:
      - alert: LLMQuotaPaused
        expr: max(jobpilot_llm_paused) == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LLM work is paused: provider out of credit"
          description: "All AI generation, analysis and matching is on hold until the OpenRouter key has credit again."
          runbook_url: "https://github.com/cysong/JobPilot/blob/master/docs/runbooks.md#llmquotapaused"

  # ===== Matching v3 =====
  # Gauges come from job_matches via the API process, so they stay correct across
  # worker restarts. All read 0 while MATCH_V3_ENABLED is off.
  - name: jobpilot_matching
    rules:
      - alert: MatchQueueStale
        # Backfill rows are excluded: they drain over days under the daily limit.
        expr: jobpilot_match_queue_oldest_age_seconds > 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A new job has waited more than 24h to be matched"
          description: "Oldest queued new-job match is {{ $value | humanizeDuration }} old."
          runbook_url: "https://github.com/cysong/JobPilot/blob/master/docs/runbooks.md#matchqueuestale"

      - alert: MatchFailedFinalRatio
        expr: |
          sum(jobpilot_match_judged_24h{status="failed_final"}) / sum(jobpilot_match_judged_24h) > 0.05
          and sum(jobpilot_match_judged_24h) >= 20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of match judgments failed for good in the last 24h"
          description: "failed_final share is {{ $value | humanizePercentage }}."
          runbook_url: "https://github.com/cysong/JobPilot/blob/master/docs/runbooks.md#matchfailedfinalratio"

      - alert: MatchNoATier
        # Tier drift guard: a prompt or model regression usually shows up as A vanishing.
        expr: |
          sum(jobpilot_match_tier_24h{tier="A"}) == 0
          and sum(jobpilot_match_judged_24h{status=~"rated|rejected"}) > 20
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No A-tier match among more than 20 judgments in the last 24h"
          description: "Check the tier distribution for a prompt or model regression."
          runbook_url: "https://github.com/cysong/JobPilot/blob/master/docs/runbooks.md#matchnoatier"

  # ===== Infrastructure =====
  - name: jobpilot_infra
    rules:
      - alert: APIDown
        expr: up{job="jobpilot-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "JobPilot API target is down"
          description: "Prometheus has been unable to scrape jobpilot-api for >1m."
          runbook_url: "https://github.com/cysong/JobPilot/blob/master/docs/runbooks.md#apidown"

      - alert: PrometheusTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
          description: "Scrape target {{ $labels.instance }} ({{ $labels.job }}) has been down for >5m."
          runbook_url: "https://github.com/cysong/JobPilot/blob/master/docs/runbooks.md#prometheustargetdown"

      - alert: HighRedisMemory
        # Guarded against `redis_memory_max_bytes = 0` (unlimited Redis) which
        # would otherwise make `used / 0 = +Inf` and fire continuously. The
        # `and` clause silences the alert when maxmemory is not configured.
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.8
          and redis_memory_max_bytes > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage exceeded 80%"
          description: "Redis memory is at {{ $value | humanizePercentage }}."
          runbook_url: "https://github.com/cysong/JobPilot/blob/master/docs/runbooks.md#highredismemory"
