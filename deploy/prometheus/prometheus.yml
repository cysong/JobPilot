global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["jobpilot-alertmanager:9093"]

scrape_configs:
  # FastAPI application metrics (instrumentator + business counters)
  - job_name: jobpilot-api
    static_configs:
      - targets: ["jobpilot-api:8000"]
    metrics_path: /metrics

  # Celery worker business metrics (Celery signals + LLM gateway counters)
  - job_name: jobpilot-worker
    static_configs:
      - targets: ["jobpilot-worker:9101"]
    metrics_path: /metrics

  # Redis metrics via redis-exporter
  - job_name: redis
    static_configs:
      - targets: ["jobpilot-redis-exporter:9121"]

  # Container resource metrics via cAdvisor
  - job_name: cadvisor
    static_configs:
      - targets: ["jobpilot-cadvisor:8080"]
