# Alertmanager config for JobPilot (Alertmanager >= 0.28: the email template
# uses tz / date / since).
#
# Email delivery uses Gmail SMTP (smtp.gmail.com:587), sharing the same Gmail
# account already configured for Grafana (GF_SMTP_*). The password is sourced
# from $GF_SMTP_PASSWORD in monitoring.env and written to a secret file by the
# alertmanager container entrypoint; this config reads it via
# `auth_password_file` so the secret never appears in the file.
#
# Resend (used by the application for user verification / password-reset
# emails) is intentionally NOT used here — alerting and product email run on
# independent rails so degradation of one cannot mask the other.
#
# Severity-based routing (single mailbox, throttled differently):
#   critical → send immediately, repeat every 1h, email on resolve too
#   warning  → batch for 2m, re-notify a changed group at most every 30m,
#              repeat every 12h, no resolve email (it doubled the mail volume)
#   info     → suppressed (visible in Grafana only)

global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: gmail-warning
  group_by: [alertname, severity]
  group_wait: 2m
  # A group whose members change (e.g. one more LLM agent starts failing) is
  # re-sent after group_interval; 5m turned one outage into 14 emails.
  group_interval: 30m
  repeat_interval: 12h
  routes:
    - matchers:
        - severity = critical
      receiver: gmail-critical
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 1h
    - matchers:
        - severity = info
      receiver: "null"

receivers:
  - name: "null"

  - name: gmail-critical
    email_configs:
      - &gmail
        to: yansongc@gmail.com
        from: "JobPilot Alerts <yansongc@gmail.com>"
        smarthost: smtp.gmail.com:587
        auth_username: yansongc@gmail.com
        auth_identity: yansongc@gmail.com
        auth_password_file: /etc/alertmanager/secrets/smtp_password
        require_tls: true
        send_resolved: true
        headers:
          Subject: '{{ template "jobpilot.subject" . }}'
        html: '{{ template "jobpilot.html" . }}'

  - name: gmail-warning
    email_configs:
      - <<: *gmail
        send_resolved: false

inhibit_rules:
  # When a critical fires, suppress the same-named warning to avoid duplicates
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: [alertname]

  # When the API is down, suppress all derived business alerts
  - source_matchers:
      - alertname = APIDown
    target_matchers:
      - severity =~ "warning|critical"

  # One LLM root cause, one email: while LLM work is paused (quota / auth /
  # model / manual) or the outage breaker is open, the failure-rate alerts it
  # causes downstream are noise. On 2026-11-09 an exhausted OpenRouter key
  # produced 23 emails across these four alerts.
  - source_matchers:
      - alertname =~ "LLMPaused|LLMOutageBreakerOpen"
    target_matchers:
      - alertname =~ "LLMCallFailureRate|CeleryTaskFailureRate|MatchFailedFinalRatio|MatchQueueStale|MatchNoATier|CeleryRetryStorm"
