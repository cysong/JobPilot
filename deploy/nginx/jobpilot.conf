# JobPilot Nginx site config
# Place this under your nginx sites directory and reload nginx.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name app.freeclaw.cloud api.freeclaw.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.freeclaw.cloud;

    # Replace with your real certificate paths.
    ssl_certificate     /etc/letsencrypt/live/app.freeclaw.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.freeclaw.cloud/privkey.pem;

    root /var/www/jobpilot/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}

server {
    listen 443 ssl http2;
    server_name api.freeclaw.cloud;

    # Replace with your real certificate paths.
    ssl_certificate     /etc/letsencrypt/live/app.freeclaw.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.freeclaw.cloud/privkey.pem;

    client_max_body_size 20m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:18000;
    }

    # Grafana dashboard — accessible at https://api.freeclaw.cloud/grafana
    location /grafana/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:13000;
    }
}
