services:
  jobpilot-api:
    image: ${JOBPILOT_IMAGE}
    container_name: jobpilot-api
    restart: unless-stopped
    env_file:
      - ./deploy/env/backend.env
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:18000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      jobpilot-redis:
        condition: service_healthy
    networks:
      - jobpilot-internal

  jobpilot-worker:
    image: ${JOBPILOT_IMAGE}
    container_name: jobpilot-worker
    restart: unless-stopped
    env_file:
      - ./deploy/env/backend.env
    command: ["uv", "run", "python", "run_celery_worker.py"]
    depends_on:
      jobpilot-redis:
        condition: service_healthy
    networks:
      - jobpilot-internal

  jobpilot-beat:
    image: ${JOBPILOT_IMAGE}
    container_name: jobpilot-beat
    restart: unless-stopped
    env_file:
      - ./deploy/env/backend.env
    command: ["uv", "run", "python", "run_celery_beat.py"]
    depends_on:
      jobpilot-redis:
        condition: service_healthy
    networks:
      - jobpilot-internal

  jobpilot-redis:
    image: redis:7-alpine
    container_name: jobpilot-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - jobpilot-internal

volumes:
  redis-data:

networks:
  jobpilot-internal:
    name: jobpilot-internal
