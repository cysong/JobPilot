<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPilot - Resumes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
    <!-- Nav -->
    <nav class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-8">
            <div class="font-bold text-xl text-primary-600 flex items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
                JobPilot
            </div>
            <div class="hidden md:flex gap-6 text-sm font-medium text-slate-600">
                <a href="dashboard.html" class="hover:text-primary-600">Dashboard</a>
                <a href="jobs.html" class="hover:text-primary-600">Jobs</a>
                <a href="applications.html" class="hover:text-primary-600">Applications</a>
                <a href="resumes.html" class="text-primary-600">Resumes</a>
            </div>
        </div>

        <!-- User Dropdown -->
        <div class="relative group">
            <button
                class="w-8 h-8 rounded-full bg-slate-200 overflow-hidden border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User" />
            </button>
            <!-- Dropdown Menu -->
            <div
                class="absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-slate-100 py-2 hidden group-hover:block z-50">
                <div class="px-4 py-2 border-b border-slate-100 mb-1">
                    <p class="text-sm font-bold text-slate-900">Felix Chen</p>
                    <p class="text-xs text-slate-500 truncate">felix.chen@example.com</p>
                </div>
                <a href="profile.html"
                    class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 hover:text-primary-600 transition-colors">
                    User Profile
                </a>
                <a href="#"
                    class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 hover:text-primary-600 transition-colors">
                    Settings
                </a>
                <div class="border-t border-slate-100 my-1"></div>
                <a href="index.html" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
                    Sign out
                </a>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <main class="flex-1 container mx-auto max-w-6xl p-6">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900">My Resumes</h1>
            <button
                class="px-4 py-2 bg-primary-600 text-white font-medium rounded-lg hover:bg-primary-700 transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Upload New
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Resume Card 1 (Linked to Detail) -->
            <a href="resume_detail.html"
                class="block bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition-shadow group relative">
                <div class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button class="text-slate-400 hover:text-slate-600"><svg class="w-5 h-5" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z">
                            </path>
                        </svg></button>
                </div>
                <div class="w-12 h-12 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center mb-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                </div>
                <h3 class="font-bold text-slate-900">Full Stack Resume v2</h3>
                <p class="text-sm text-slate-500 mt-1">Updated 2 days ago</p>
                <div class="mt-4 flex gap-2">
                    <span class="px-2 py-1 bg-slate-100 text-slate-600 text-xs rounded">PDF</span>
                    <span class="px-2 py-1 bg-yellow-100 text-yellow-800 text-xs rounded">Draft</span>
                </div>
            </a>

            <!-- Resume Card 2 -->
            <div
                class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition-shadow group relative">
                <div class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button class="text-slate-400 hover:text-slate-600"><svg class="w-5 h-5" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z">
                            </path>
                        </svg></button>
                </div>
                <div class="w-12 h-12 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center mb-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                </div>
                <h3 class="font-bold text-slate-900">General Resume</h3>
                <p class="text-sm text-slate-500 mt-1">Updated 1 week ago</p>
                <div class="mt-4 flex gap-2">
                    <span class="px-2 py-1 bg-slate-100 text-slate-600 text-xs rounded">PDF</span>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
