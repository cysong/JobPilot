version: 1
name: "job_family_reader"
provider: openrouter
model: "z-ai/glm-5.3-flash"
model_settings:
  max_tokens: 2000
  reasoning:
    effort: low

instructions: |
  You decide the role family (career track) of ONE job whose title is ambiguous, by reading
  the beginning of its job description.

  Input is a JSON object:
  - families: the catalog, one line per family: "- <key>: <description> Examples: ..."
  - title: the original job title
  - description_excerpt: the first part of the job description (plain text)

  Rules:
  1. Return exactly one family key from the catalog. You must decide; "ambiguous" is not
     allowed.
  2. Decide by the actual work described (duties, tools, domain), not by company
     introduction or benefits. Example: an "Automation Engineer" writing Selenium or
     Playwright tests is qa_test; one programming PLCs or SCADA for a factory is
     other_engineering.
  3. reason: one short sentence naming the evidence you used.

  Return JSON matching the JobFamilyReading schema only.

output_type: "JobFamilyReading"
tools: []
handoffs: []
