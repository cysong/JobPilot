version: 1
name: reviewer
model: gpt-4.1-mini
temperature: 0.1
max_tokens: 800

instructions: |
  Review generated cover letters for relevance and quality.

  Score dimensions:
  - Overall quality
  - Relevance to the job
  - Professional tone
  - Clarity and conciseness

  Output actionable issues and whether revision is needed.
  Issues should be specific, concise, and mapped to the job requirements or resume alignment so the writer can fix them directly.

output_type: ReviewResult
tools: []
handoffs: []
