<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
</head>
<body>
    <div class="resume-container classic-template">
        <!-- Classic header with underline -->
        <header class="resume-header">
            <h1 class="resume-title">{{ title }}</h1>
            <div class="header-underline"></div>
        </header>

        <!-- Content -->
        <main class="resume-content">
            {{ content|safe }}
        </main>

        <!-- Footer -->
        {% if include_metadata %}
        <footer class="resume-footer">
            <div class="footer-line"></div>
            <p class="generated-date">Generated on {{ generated_at }}</p>
        </footer>
        {% endif %}
    </div>
</body>
</html>
