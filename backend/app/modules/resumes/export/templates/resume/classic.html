<!DOCTYPE html>
<html lang="{{ language }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
</head>

<body>
    <div class="resume-container classic-template">
        <!-- No template header: the resume's own first H1 (the name) is the title -->
        <!-- Content -->
        <main class="resume-content">
            {{ content|safe }}
        </main>

        <!-- Footer -->
        {% if include_metadata %}
        <footer class="resume-footer">
            <div class="footer-line"></div>
            <p class="generated-date">Generated on {{ generated_at }}</p>
        </footer>
        {% endif %}
    </div>
</body>

</html>
