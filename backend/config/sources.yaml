# Job source display metadata.
#
# Consumed by GET /api/v1/jobs/sources/meta. The backend only exposes
# non-visual metadata (label / brand_color / flags). Icons are bundled
# in the frontend and looked up by `key` — see frontend/src/config/sourceIcons.ts.
#
# To add a new source:
#   1. Append a new entry here (must match the value written to seek_jobs.source).
#   2. Drop the icon file at frontend/src/assets/source-icons/<key>.<ext>.
#   3. Register it in frontend/src/config/sourceIcons.ts.
#
# Order of this list is preserved and used as the default display order.

sources:
  - key: linkedin
    label: LinkedIn
    brand_color: "#0A66C2"
    external_apply: true
    enabled: true

  - key: seek
    label: Seek
    brand_color: "#0D3880"
    external_apply: false
    enabled: true

  - key: greenhouse
    label: Greenhouse
    brand_color: "#27AE60"
    external_apply: true
    enabled: true

  - key: glassdoor
    label: Glassdoor
    brand_color: "#0CAA41"
    external_apply: true
    enabled: true

  - key: workable
    label: Workable
    brand_color: "#5462E2"
    external_apply: true
    enabled: true

  - key: smartrecruiters
    label: SmartRecruiters
    brand_color: "#0093D0"
    external_apply: true
    enabled: true

  - key: successfactors_csb
    label: SuccessFactors CSB
    brand_color: "#0FAAFF"
    external_apply: true
    enabled: true

  - key: pageup_jobtools
    label: PageUp JobTools
    brand_color: "#3090E8"
    external_apply: true
    enabled: true

  - key: workday
    label: Workday
    brand_color: "#F38B00"
    external_apply: true
    enabled: true
